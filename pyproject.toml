[project]
name = "my-stock"
version = "0.1.0"
description = "거래 원장 기반 주식 포트폴리오 관리 (CLI + 웹)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI 의 Depends()/Form() 기본값은 프레임워크 표준 관용구다.
ignore = ["B008"]
