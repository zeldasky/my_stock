<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}my_stock{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if account %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">my<span>_</span>stock</a>
    <nav class="tabs">
      <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">대시보드</a>
      <a href="/transactions" class="{% if page == 'transactions' %}active{% endif %}">거래내역</a>
      <a href="/targets" class="{% if page == 'targets' %}active{% endif %}">목표</a>
      <a href="/logout">로그아웃</a>
    </nav>
  </div>
</header>
{% endif %}

<main>
  {% if msg %}<div class="alert ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="alert err">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
